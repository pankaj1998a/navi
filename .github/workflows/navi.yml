name: navi

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  navi:
    if: |
      contains(github.event.comment.body, ' /nv') ||
      startsWith(github.event.comment.body, '/nv') ||
      contains(github.event.comment.body, ' /navi') ||
      startsWith(github.event.comment.body, '/navi')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Run navi
        uses: ./github
        env:
          NAVI_API_KEY: ${{ secrets.NAVI_API_KEY }}
          NAVI_PERMISSION: '{"bash": "deny"}'
        with:
          model: anthropic/claude-3-5-sonnet-latest
