name: "Setup Bun"
description: "Setup Bun with caching and install dependencies"
runs:
  using: "composite"
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Cache ~/.bun
      id: cache-bun
      uses: actions/cache@v4
      with:
        path: ~/.bun
        key: ${{ runner.os }}-bun-${{ hashFiles('package.json') }}-${{ hashFiles('bun.lockb', 'bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-${{ hashFiles('package.json') }}-

    - name: Cache TypeScript incremental build
      id: cache-tsbuild
      uses: actions/cache@v4
      with:
        path: packages/navi/node_modules/.tmp
        key: ${{ runner.os }}-tsbuild-${{ hashFiles('packages/navi/tsconfig.json') }}-${{ hashFiles('packages/navi/src/**/*.ts', 'packages/navi/src/**/*.tsx') }}
        restore-keys: |
          ${{ runner.os }}-tsbuild-${{ hashFiles('packages/navi/tsconfig.json') }}-

    - name: Install dependencies
      run: bun install
      shell: bash
