[package]
name = "navi-web"
version = "0.1.0"
edition = "2021"
authors = ["Navi Team"]
description = "Navi Native High-Performance Web & PTY Server"
license = "MIT"

[[bin]]
name = "navi-web"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
uuid = { version = "1.10", features = ["v4"] }
subtle = "2.6"
dirs = "5.0"
base64 = "0.22"
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
mime_guess = "2.0"
portable-pty = "0.8"

