<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Multi-AI Workspace — NaviBridge</title>
<style>
:root { --bg:#0b0f17; --panel:#121826; --panel2:#0e1420; --line:#232b3d; --tx:#dbe4f5; --dim:#7c8aa5; --acc:#5b8cff; --ok:#3ecf8e; --warn:#ffb454; --bad:#ff6b7a; }
* { box-sizing:border-box; }
body { margin:0; font-family:"Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--tx); height:100vh; display:flex; flex-direction:column; }
header { display:flex; align-items:center; gap:10px; padding:8px 14px; border-bottom:1px solid var(--line); background:var(--panel); }
header h1 { font-size:14px; margin:0; font-weight:600; }
header .mode-tag { font-size:12px; color:var(--acc); background:rgba(91,140,255,.12); border:1px solid rgba(91,140,255,.35); padding:2px 8px; border-radius:10px; }
header .sp { flex:1; }
header button { background:var(--panel2); color:var(--tx); border:1px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer; font-size:12px; }
header button:hover { border-color:var(--acc); }
main { flex:1; display:grid; grid-template-columns:320px 1fr; gap:0; min-height:0; }
#setup { border-right:1px solid var(--line); padding:12px; overflow-y:auto; background:var(--panel2); }
#setup h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:14px 0 6px; }
#setup select, #setup input[type=number] { width:100%; background:var(--panel); color:var(--tx); border:1px solid var(--line); border-radius:8px; padding:7px 9px; font-size:13px; }
.member { display:flex; align-items:center; gap:7px; padding:6px 8px; border:1px solid var(--line); border-radius:9px; margin-bottom:6px; background:var(--panel); }
.member.on { border-color:var(--acc); }
.member input[type=checkbox] { accent-color:var(--acc); width:15px; height:15px; cursor:pointer; }
.member b { flex:1; font-size:13px; }
.member select { width:130px; background:var(--panel2); color:var(--tx); border:1px solid var(--line); border-radius:7px; padding:4px 6px; font-size:11px; }
.member select:disabled { color:var(--dim); }
#startbtn { width:100%; margin-top:12px; background:var(--acc); color:#0b0f17; border:0; border-radius:9px; padding:10px; font-weight:700; font-size:13px; cursor:pointer; }
#startbtn:disabled { opacity:.45; cursor:not-allowed; }
#setup .hint { font-size:11px; color:var(--dim); margin-top:4px; line-height:1.5; }
#right { display:flex; flex-direction:column; min-height:0; }
#stream { flex:1; overflow-y:auto; padding:14px 18px; display:flex; flex-direction:column; gap:10px; }
.turn { display:flex; gap:10px; }
.turn .av { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; flex-shrink:0; color:#fff; background:#56617a; }
.turn .body { flex:1; min-width:0; }
.turn .meta { font-size:11px; color:var(--dim); margin-bottom:3px; display:flex; gap:8px; align-items:center; }
.turn .meta .pos { color:var(--warn); }
.turn .bubble { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 13px; font-size:13.5px; line-height:1.55; white-space:pre-wrap; word-break:break-word; }
.turn.ai-working .bubble { color:var(--dim); font-style:italic; }
.turn.phasehead { flex-direction:column; }
.turn.phasehead .bubble { background:transparent; border:0; color:var(--acc); font-weight:700; font-size:12px; padding:0; letter-spacing:.05em; }
.turn.verdict .bubble { border-color:var(--ok); background:rgba(62,207,142,.06); }
.composer { border-top:1px solid var(--line); background:var(--panel); padding:10px 14px; display:flex; gap:8px; }
.composer textarea { flex:1; resize:none; height:52px; background:var(--panel2); color:var(--tx); border:1px solid var(--line); border-radius:9px; padding:8px 10px; font-size:13px; font-family:inherit; }
.composer button { align-self:flex-end; background:var(--acc); color:#0b0f17; border:0; border-radius:9px; padding:10px 18px; font-weight:700; cursor:pointer; }
.composer button:disabled { opacity:.45; cursor:not-allowed; }
.empty { color:var(--dim); text-align:center; margin:auto; font-size:13px; }
#st.ok { color:var(--ok); } #st.bad { color:var(--bad); }
</style>
</head>
<body>
<header>
  <h1>🎛 Multi-AI Workspace</h1>
  <span class="mode-tag" id="modetag">Council</span>
  <span class="sp"></span>
  <span id="st">idle</span>
  <button id="stopbtn">■ Stop</button>
</header>
<main>
  <section id="setup">
    <h2>Mode</h2>
    <select id="mode">
      <option value="council">🏛 Council — propose → critique → revise → verdict</option>
      <option value="debate">🗣 Multi-Round Debate</option>
      <option value="compare">⚔ Compare Providers</option>
      <option value="chat">💬 Multi-AI Chat</option>
    </select>
    <div id="roundsrow">
      <h2>Debate rounds</h2>
      <input type="number" id="rounds" min="1" max="3" value="2">
    </div>
    <h2>Participants &amp; positions</h2>
    <div id="members"></div>
    <div class="hint" id="poshint"></div>
    <button id="startbtn">▶ Start</button>
    <div class="hint">Selections are saved automatically and apply to the next run — change them any time, even between rounds, while stopped.</div>
  </section>
  <section id="right">
    <div id="stream"><div class="empty">Pick AIs → type a question below → Start</div></div>
    <div class="composer">
      <textarea id="qq" placeholder="Type the question / topic for this run…"></textarea>
      <button id="sendbtn">Send</button>
    </div>
  </section>
</main>
<script src="workspace.js"></script>
</body>
</html>
